name: Deploy Job Feed Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Data/JobFeed/**"
      - ".github/workflows/deploy-job-feed-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Upload job feed Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Data/JobFeed

      - name: Deploy job feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
